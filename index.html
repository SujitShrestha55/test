<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#080b14"/>
<title>SuperPOS</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="app dark" id="appRoot">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brandIcon"><i data-lucide="shopping-cart" style="width:20px;height:20px"></i></div>
      <div><b>SuperPOS</b><span>Inventory System</span></div>
      <button class="icon mobileClose" id="mobileCloseBtn"><i data-lucide="x"></i></button>
    </div>
    <div class="branch">
      <div class="branchAvatar">S</div>
      <div><b>Supermarket</b><span>Main Branch</span></div>
      <i data-lucide="chevron-right" style="width:15px;height:15px"></i>
    </div>
    <nav id="navList"></nav>
    <div class="user">
      <div class="avatar">A</div>
      <div><b>Admin</b><span><i data-lucide="shield-check" style="width:11px;height:11px"></i> Administrator</span></div>
    </div>
  </aside>

  <main class="main">
    <header>
      <button class="icon mobileMenu" id="mobileMenuBtn"><i data-lucide="menu"></i></button>
      <b class="mobileTitle">SuperPOS</b>
      <div class="topSearch">
        <i data-lucide="search" style="width:17px;height:17px"></i>
        <input id="topSearchInput" placeholder="Search products, sales..."/>
        <kbd>⌘ K</kbd>
      </div>
      <div class="actions">
        <button class="icon"><i data-lucide="bell" style="width:18px;height:18px"></i></button>
        <button class="icon" id="themeToggleBtn"><i data-lucide="sun" style="width:18px;height:18px"></i></button>
        <div class="topAvatar">A</div>
      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>

<!-- Camera barcode scan modal -->
<div class="scanModal" id="scanModal">
  <div class="scanBox">
    <h3><i data-lucide="camera" style="width:17px;height:17px"></i> Scan barcode with camera</h3>
    <div class="videoWrap">
      <video id="scanVideo" autoplay muted playsinline></video>
      <div class="scanFrame"></div>
    </div>
    <div class="scanStatus" id="scanStatus">Requesting camera access…</div>
    <div class="scanActions">
      <button class="retryBtn" id="scanRetryBtn">Try again</button>
      <button class="cancelBtn" id="scanCancelBtn">Cancel</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="app.js"></script>
</body>
</html>
